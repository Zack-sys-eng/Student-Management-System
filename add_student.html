<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student - Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        .form-container {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .section-title {
            font-size: 19px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        input,
        select,
        textarea {
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            width: 100%;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 13px 22px;
            border-radius: 9px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .cancel {
            background: #eee;
            color: #555;
        }

        .save {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .save:hover {
            opacity: 0.9;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .container {
                margin: 25px auto;
            }

            .form-container {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->

    <div class="navbar">

        <h1>🎓 Student Management System</h1>

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

    </div>


    <!-- Main Content -->

    <div class="container">

        <div class="header">

            <h2>➕ Add New Student</h2>

            <p>
                Enter the student's information below.
            </p>

        </div>


        <div class="form-container">

            <form method="POST">

                <!-- Personal Information -->

                <h3 class="section-title">
                    👤 Personal Information
                </h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label for="student_id">
                            Student ID *
                        </label>

                        <input
                            type="text"
                            id="student_id"
                            name="student_id"
                            placeholder="e.g. 26MCA20147"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="name">
                            Full Name *
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="student@example.com"
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <select id="gender" name="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="1"
                            max="100"
                            placeholder="Enter age"
                        >

                    </div>

                </div>


                <!-- Academic Information -->

                <h3 class="section-title">
                    🎓 Academic Information
                </h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label for="course">
                            Course
                        </label>

                        <input
                            type="text"
                            id="course"
                            name="course"
                            placeholder="e.g. MCA"
                        >

                    </div>


                    <div class="form-group">

                        <label for="semester">
                            Semester
                        </label>

                        <select id="semester" name="semester">

                            <option value="">
                                Select Semester
                            </option>

                            <option value="1">
                                Semester 1
                            </option>

                            <option value="2">
                                Semester 2
                            </option>

                            <option value="3">
                                Semester 3
                            </option>

                            <option value="4">
                                Semester 4
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <input
                            type="text"
                            id="department"
                            name="department"
                            placeholder="e.g. Computer Applications"
                        >

                    </div>


                    <div class="form-group">

                        <label for="marks">
                            Marks (%)
                        </label>

                        <input
                            type="number"
                            id="marks"
                            name="marks"
                            min="0"
                            max="100"
                            step="0.01"
                            value="0"
                            placeholder="0 - 100"
                        >

                    </div>


                    <div class="form-group">

                        <label for="attendance">
                            Attendance (%)
                        </label>

                        <input
                            type="number"
                            id="attendance"
                            name="attendance"
                            min="0"
                            max="100"
                            step="0.01"
                            value="0"
                            placeholder="0 - 100"
                        >

                    </div>


                    <div class="form-group full">

                        <label for="address">
                            Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            placeholder="Enter student's address"
                        ></textarea>

                    </div>

                </div>


                <!-- Buttons -->

                <div class="buttons">

                    <a
                        href="{{ url_for('students') }}"
                        class="btn cancel"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn save"
                    >
                        💾 Save Student
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
